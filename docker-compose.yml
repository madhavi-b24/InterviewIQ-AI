# Local/dev topology — Architecture.md §9. The execution sandbox and a
# Celery worker are deliberately not here yet; both are deferred to the
# modules that implement them (Roadmap.md Module 6 / Module 9).
#
# frontend is intentionally absent until the frontend scaffold is built.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interviewiq
      POSTGRES_PASSWORD: interviewiq
      POSTGRES_DB: interviewiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.20
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Container-network hostnames override the localhost defaults in .env
      DATABASE_URL: postgresql+asyncpg://interviewiq:interviewiq@postgres:5432/interviewiq
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

volumes:
  postgres_data:
  chroma_data:
