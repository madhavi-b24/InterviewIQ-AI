[project]
name = "interviewiq-backend"
version = "0.1.0"
description = "InterviewIQ AI backend — FastAPI + LangGraph multi-agent interview engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "redis>=5.2,<6.0",
    # Thin HTTP client only — we always talk to a separate ChromaDB server
    # container (docker-compose.yml), never embed Chroma in-process. This
    # avoids chromadb's full package pulling in hnswlib/onnxruntime, which
    # need a C++ toolchain to build on some platforms.
    "chromadb-client>=0.5,<0.6",
    "langgraph>=0.2,<0.3",
    "langgraph-checkpoint-postgres>=2.0,<3.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "langchain-core>=0.3,<0.4",
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4,<25.0",
    "argon2-cffi>=23.1,<24.0",
    "httpx>=0.27,<0.28",
    "pypdf>=6.14.2",
    "google-genai>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<0.8",
    "black>=24.10,<25.0",
    "python-dotenv>=1.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- Ruff: linting + import sorting only. Formatting is delegated to Black
# below (per project standard) rather than `ruff format`, so the two tools
# must agree on line-length to avoid fighting each other.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
# Autogenerated migration files are generated artifacts, not hand-written
# code — don't hold them to the same style rules.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python idioms)
    "B",   # bugbear (common bug patterns)
    "SIM", # simplify
]
ignore = ["B008"]  # FastAPI's Depends(...) in argument defaults is idiomatic, not a bug

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --- Black: formatting
[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "alembic/versions"

# --- pytest
# .env.test is loaded explicitly in tests/conftest.py via python-dotenv,
# before app.core.config.Settings is imported anywhere.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
